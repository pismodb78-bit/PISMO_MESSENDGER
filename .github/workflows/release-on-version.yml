name: Релиз по версии

# Выпуск релиза из ветки разработки.
#
# Зачем отдельно от release.yml: тот запускается ТОЛЬКО кнопкой, а кнопку
# GitHub показывает лишь для файлов из основной ветки. Пока release.yml нет в
# master, выпустить версию из ветки нечем, и релизы ПК приходилось собирать
# руками на своей машине.
#
# Срабатывает сам при пуше, но публикует релиз ТОЛЬКО если релиза с такой
# версией ещё нет. Это важно: release.yml намеренно сделан ручным, чтобы
# автовыпуск не перезаписал архив, приложенный к тегу вручную. Здесь то же
# правило соблюдено — существующий релиз не трогается вообще. Чтобы выпустить
# новую версию, достаточно поднять <Version> в PISMO/PISMO.csproj.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Версия из csproj
        id: ver
        shell: pwsh
        run: |
          $xml = [xml](Get-Content PISMO\PISMO.csproj)
          $ver = (($xml.Project.PropertyGroup.Version | Where-Object { $_ }) -as [string]).Trim()
          if (-not $ver) { throw "В PISMO.csproj нет <Version>" }
          # Тег трёхчастный, как у прошлых релизов: 2.9.3.0 → 2.9.3.
          # Обновлялка сравнивает тег с версией сборки, см. PISMO/Updater.cs.
          $tag = $ver -replace '\.0$', ''
          Write-Host "csproj: $ver   тег: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Релиз с такой версией уже есть?
        id: have
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          # Спрашиваем сами, а не через gh: в pwsh на раннере ненулевой код
          # возврата внешней команды — обрыв шага, а 404 здесь это нормальный
          # ответ «релиза ещё нет», а не ошибка.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
            "User-Agent"  = "pismo-ci"
          }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $resp = Invoke-WebRequest -Uri $url -Headers $headers -SkipHttpErrorCheck
          if ($resp.StatusCode -eq 200) {
            Write-Host "Релиз $tag уже опубликован — ничего не делаем."
            "skip=true" >> $env:GITHUB_OUTPUT
          } elseif ($resp.StatusCode -eq 404) {
            Write-Host "Релиза $tag нет — выпускаем."
            "skip=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "Непонятный ответ GitHub: $($resp.StatusCode)"
          }

      - name: Setup .NET 8
        if: steps.have.outputs.skip == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        if: steps.have.outputs.skip == 'false'
        run: dotnet restore PISMO.sln

      - name: Build (Release)
        if: steps.have.outputs.skip == 'false'
        run: dotnet build PISMO.sln -c Release --no-restore

      - name: Запаковать PISMO.zip
        if: steps.have.outputs.skip == 'false'
        shell: pwsh
        run: |
          # Папка выпуска — та, где PISMO.exe лежит РЯДОМ с рантайм-файлами.
          #
          # Раньше здесь брали папку с exe «по времени записи», а внутри неё
          # dotnet publish создаёт свою подпапку publish. Выбор был монеткой, и
          # обе стороны плохи: подпапка publish НЕ годится для выпуска (в ней
          # нет зависимостей MySqlConnector — System.IO.Pipelines, ZstdSharp,
          # K4os.*, BouncyCastle, — с такой сборкой приложение не подключится к
          # базе), а если выбиралась папка сборки, то publish попадал в архив
          # второй копией программы: так вышло с 2.9.3, архив стал вдвое
          # тяжелее, и после обновления рядом с exe появлялась эта папка.
          #
          # Поэтому собираем тем же dotnet build, что и build.yml (его состав
          # проверен), и папку publish в архив не кладём.
          $exe = Get-ChildItem -Recurse -Filter PISMO.exe -Path PISMO\bin\Release |
                 Where-Object { $_.Directory.Name -ne 'publish' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "PISMO.exe не найден" }
          $dir = $exe.Directory.FullName
          Write-Host "Пакуем: $dir"

          # Пусть выпуск упадёт здесь, а не у человека при запуске.
          $need = @('PISMO.exe','MySqlConnector.dll','System.IO.Pipelines.dll',
                    'ZstdSharp.dll','BouncyCastle.Cryptography.dll',
                    'livekit_ffi.dll','NAudio.dll','ip.txt')
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw ("В сборке нет файлов: " + ($missing -join ', ')) }

          $staging = Join-Path $env:RUNNER_TEMP 'pismo-zip'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          Copy-Item $dir $staging -Recurse
          Remove-Item (Join-Path $staging 'publish') -Recurse -Force -ErrorAction Ignore
          # Содержимое папки в КОРЕНЬ архива: обновлялка распаковывает его
          # поверх установленной версии, вложенная папка сломала бы обновление.
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath PISMO.zip -Force
          "{0:N1} МБ" -f ((Get-Item PISMO.zip).Length / 1MB)

      - name: Опубликовать релиз
        if: steps.have.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: PISMO.zip
          fail_on_unmatched_files: true
