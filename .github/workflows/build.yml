name: build

# Автосборка PISMO при каждом пуше/PR — ловит ошибки компиляции до ручного
# билда в Visual Studio (актуально для активной разработки 2.0).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write   # CI коммитит собранный билд обратно в ветку

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PISMO.sln

      - name: Build (Release)
        run: dotnet build PISMO.sln -c Release --no-restore

      # Проверяем, что рядом с PISMO.exe действительно лежат все рантайм-файлы,
      # которые нужны нативному звонку. Именно эту папку сборки заливают в git
      # для скачивания — если файла нет, у пользователя звонок не запустится.
      - name: Verify runtime files next to exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter PISMO.exe -Path PISMO\bin\Release | Select-Object -First 1
          if (-not $exe) { throw "PISMO.exe не найден в PISMO\bin\Release" }
          $dir = $exe.Directory.FullName
          Write-Host "Папка сборки: $dir"
          $need = @('livekit_ffi.dll','Google.Protobuf.dll','NAudio.dll',
                    'AForge.Video.DirectShow.dll','MySqlConnector.dll')
          $missing = @()
          foreach ($f in $need) {
            $p = Join-Path $dir $f
            if (Test-Path $p) { Write-Host ("OK   {0}  ({1:N0} bytes)" -f $f, (Get-Item $p).Length) }
            else { $missing += $f; Write-Host "НЕТ  $f" }
          }
          if ($missing.Count -gt 0) { throw ("В сборке нет файлов: " + ($missing -join ', ')) }
          Write-Host "Все рантайм-файлы на месте."

      # Готовый к выпуску архив — артефактом сборки.
      #
      # Релизы ПК выпускают вручную: release.yml запускается кнопкой, а кнопку
      # GitHub показывает только для файлов из основной ветки. Значит, архив
      # приходилось собирать у себя — хотя он уже собран здесь, и собран тем
      # самым составом, который проверен шагом выше. Теперь его можно просто
      # скачать со страницы сборки и приложить к релизу.
      #
      # Ничего не публикуется: это файл, а не выпуск.
      - name: Версия из csproj
        id: ver
        shell: pwsh
        run: |
          $xml = [xml](Get-Content PISMO\PISMO.csproj)
          $v = (($xml.Project.PropertyGroup.Version | Where-Object { $_ }) -as [string]).Trim()
          # В csproj версия четырёхчастная (2.9.4.0), выпуск — трёхчастный.
          $short = $v -replace '\.0$', ''
          "v=$short" >> $env:GITHUB_OUTPUT

      - name: Запаковать PISMO.zip
        shell: pwsh
        run: |
          # Папка выпуска — та, где PISMO.exe лежит РЯДОМ с рантайм-файлами;
          # подпапку publish в архив не кладём (в ней нет зависимостей
          # MySqlConnector, и как вторая копия программы она только утяжеляет
          # архив — так вышло с 2.9.3).
          $exe = Get-ChildItem -Recurse -Filter PISMO.exe -Path PISMO\bin\Release |
                 Where-Object { $_.Directory.Name -ne 'publish' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "PISMO.exe не найден" }
          $dir = $exe.Directory.FullName

          # Пусть сборка упадёт здесь, а не у человека при запуске.
          $need = @('PISMO.exe','MySqlConnector.dll','System.IO.Pipelines.dll',
                    'ZstdSharp.dll','BouncyCastle.Cryptography.dll',
                    'livekit_ffi.dll','NAudio.dll','ip.txt')
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw ("В сборке нет файлов: " + ($missing -join ', ')) }

          $staging = Join-Path $env:RUNNER_TEMP 'pismo-zip'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          Copy-Item $dir $staging -Recurse
          Remove-Item (Join-Path $staging 'publish') -Recurse -Force -ErrorAction Ignore
          # Содержимое папки в КОРЕНЬ архива: обновлялка распаковывает его
          # поверх установленной версии, вложенная папка сломала бы обновление.
          #
          # Сам архив держим вне рабочей копии: ниже CI коммитит сборку в
          # ветку, и лишнему файлу там делать нечего.
          $zip = Join-Path $env:RUNNER_TEMP 'PISMO.zip'
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force
          "{0:N1} МБ" -f ((Get-Item $zip).Length / 1MB)

      - name: Выложить архив артефактом
        uses: actions/upload-artifact@v4
        with:
          name: PISMO-${{ steps.ver.outputs.v }}
          path: ${{ runner.temp }}/PISMO.zip
          if-no-files-found: error

      # Готовую сборку кладём ПРЯМО В ВЕТКУ (как раньше, без артефактов): CI
      # собирает на Windows и коммитит PISMO/bin/Release обратно. Пользователь
      # просто делает git pull и запускает PISMO.exe. Коммит помечен [skip ci],
      # чтобы не зациклить сборку.
      - name: Commit build back to branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f PISMO/bin/Release
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Сборка не изменилась — коммитить нечего."; exit 0 }
          git commit -m "CI: собранный билд PISMO/bin/Release [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
