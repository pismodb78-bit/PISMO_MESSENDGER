name: Релиз

# Выпуск версии: собрать, запаковать и опубликовать Release на GitHub.
#
# Зачем отдельно от build.yml: тот кладёт сборку прямо в ветку, и обновиться
# из неё можно только через git pull. Само приложение обновляется иначе — оно
# смотрит на ПОСЛЕДНИЙ Release репозитория (см. PISMO/Updater.cs) и качает
# оттуда PISMO.zip. Пока релиза нет, у всех остаётся та версия, что была.
#
# Как выпустить:
#   Actions → Релиз → Run workflow → tag = 2.8.10
#
# Номер тега ОБЯЗАН совпадать с <Version> в PISMO/PISMO.csproj: обновлялка
# сравнивает тег с версией запущенной сборки и предложит обновление, только
# если тег больше. Расхождение здесь означает либо вечное «есть обновление»,
# либо его молчаливое отсутствие — поэтому несовпадение останавливает выпуск.
on:
  # ТОЛЬКО по кнопке, и намеренно.
  #
  # Запуск по тегу напрашивался, но он опасен: релизы ПК выпускают вручную,
  # своей сборкой, и автоматический выпуск по тому же тегу перезаписал бы
  # приложенный к нему архив. Пусть лучше не срабатывает сам.
  #
  # Кнопку GitHub показывает только для файлов из ОСНОВНОЙ ветки, так что
  # запустить это можно будет, когда файл там окажется.
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия релиза (как в PISMO.csproj, например 2.8.10)"
        required: true
      notes:
        description: "Описание релиза (необязательно)"
        required: false

env:
  # Откуда бы ни пришли — тег один.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Сверить тег с версией проекта
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}".TrimStart('v')
          $xml = [xml](Get-Content PISMO\PISMO.csproj)
          $ver = ($xml.Project.PropertyGroup.Version | Where-Object { $_ }) -as [string]
          $ver = $ver.Trim()
          Write-Host "Тег: $tag   csproj: $ver"
          # В csproj версия четырёхчастная (2.8.10.0), тег — трёхчастный.
          if ($ver -ne $tag -and $ver -ne "$tag.0") {
            throw "Тег $tag не совпадает с версией в PISMO.csproj ($ver). Подними версию или исправь тег."
          }

      - name: Restore
        run: dotnet restore PISMO.sln

      - name: Build (Release)
        run: dotnet build PISMO.sln -c Release --no-restore

      - name: Запаковать PISMO.zip
        shell: pwsh
        run: |
          # Папка выпуска — та, где PISMO.exe лежит РЯДОМ с рантайм-файлами.
          #
          # Раньше здесь брали папку с exe «по времени записи», а внутри неё
          # dotnet publish создаёт свою подпапку publish. Выбор был монеткой, и
          # обе стороны плохи: подпапка publish НЕ годится для выпуска (в ней
          # нет зависимостей MySqlConnector — System.IO.Pipelines, ZstdSharp,
          # K4os.*, BouncyCastle, — с такой сборкой приложение не подключится к
          # базе), а если выбиралась папка сборки, то publish попадал в архив
          # второй копией программы: так вышло с 2.9.3, архив стал вдвое
          # тяжелее, и после обновления рядом с exe появлялась эта папка.
          #
          # Поэтому собираем тем же dotnet build, что и build.yml (его состав
          # проверен), и папку publish в архив не кладём.
          $exe = Get-ChildItem -Recurse -Filter PISMO.exe -Path PISMO\bin\Release |
                 Where-Object { $_.Directory.Name -ne 'publish' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "PISMO.exe не найден" }
          $dir = $exe.Directory.FullName
          Write-Host "Пакуем: $dir"

          # Пусть выпуск упадёт здесь, а не у человека при запуске.
          $need = @('PISMO.exe','MySqlConnector.dll','System.IO.Pipelines.dll',
                    'ZstdSharp.dll','BouncyCastle.Cryptography.dll',
                    'livekit_ffi.dll','NAudio.dll','ip.txt')
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw ("В сборке нет файлов: " + ($missing -join ', ')) }

          $staging = Join-Path $env:RUNNER_TEMP 'pismo-zip'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          Copy-Item $dir $staging -Recurse
          Remove-Item (Join-Path $staging 'publish') -Recurse -Force -ErrorAction Ignore
          # Содержимое папки в КОРЕНЬ архива: обновлялка распаковывает его
          # поверх установленной версии, вложенная папка сломала бы обновление.
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath PISMO.zip -Force
          "{0:N1} МБ" -f ((Get-Item PISMO.zip).Length / 1MB)

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: ${{ github.event.inputs.notes }}
          files: PISMO.zip
          fail_on_unmatched_files: true
